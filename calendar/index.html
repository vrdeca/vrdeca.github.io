<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Calendar — Vista Ridge DECA</title>
  <meta name="description" content="Every Vista Ridge DECA event this year — District, State, ICDC, meetings, and prep workshops." />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-root"></div>
  <div id="marquee-root"></div>

  <main id="main">
    <section class="section-pad" style="padding-top:calc(var(--nav-height) + var(--space-10));">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="eyebrow">Full calendar</p>
          <h2>Every event, one place.</h2>
          <p>District, State, and ICDC anchor the season — plus every chapter meeting and prep session along the way.</p>
        </div>

        <div class="view-toggle" data-reveal style="margin-bottom:var(--space-8);">
          <button data-view="list" class="is-active">List</button>
          <button data-view="grid">Calendar</button>
        </div>

        <div id="event-list-view"></div>
        <div id="cal-grid-view" style="display:none;"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="/src/pages/calendar.js"></script>
</body>
</html>
